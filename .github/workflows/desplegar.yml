name: Desplegar a GitHub Pages

on:
  push:
    branches: [main]
  # Permite lanzarlo a mano desde la pestaña Actions.
  workflow_dispatch:

# El token solo necesita poder publicar en Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# Si llegan dos pushes seguidos, que el segundo espere en vez de pelearse por
# el despliegue; no se cancela el que ya está en marcha.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  construir:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Las reglas de fusión deciden qué pasa al importar un fichero de otro
      # dispositivo: si fallan, el despliegue no sale.
      - run: npm test

      - run: npm run build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  desplegar:
    needs: construir
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.despliegue.outputs.page_url }}
    steps:
      - id: despliegue
        uses: actions/deploy-pages@v4
