# Cabeceras de seguridad.
#
# Van en un fichero aparte porque hay que repetirlas en CADA location que
# declare su propio `add_header`: nginx no las acumula, las sustituye. Un
# `add_header Cache-Control` dentro de un location descarta en silencio todas
# las cabeceras heredadas del bloque server, y la CSP desaparecía justo en el
# documento principal, que es donde hace falta.
#
# El hash es del script en línea de index.html que marca el tema antes del
# primer pintado. Si se toca ese script hay que regenerarlo: npm run csp
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "no-referrer" always;
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'sha256-8dyD3OXkMH/OpK1iOjTdBbfv9PjPOS9VsUktv0jq0Ng='; img-src 'self' data:; style-src 'self' 'unsafe-inline'; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;
