server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # Es una SPA: cualquier ruta que no sea un fichero la resuelve el router del
  # cliente. Sin esto, recargar en /esquema/:id daría 404.
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Los assets llevan hash en el nombre, así que pueden cachearse para siempre.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # El service worker y el index NO se cachean: si se quedaran pegados, la app
  # nunca se actualizaría aunque se redesplegara la imagen.
  location = /sw.js {
    add_header Cache-Control "no-cache, no-store, must-revalidate";
  }
  location = /index.html {
    add_header Cache-Control "no-cache, no-store, must-revalidate";
  }
  location = /manifest.webmanifest {
    add_header Cache-Control "no-cache";
    types { } default_type application/manifest+json;
  }

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;

  # La app no habla con nadie: no hay a dónde filtrar datos ni de dónde
  # cargar scripts. La CSP lo deja por escrito.
  add_header X-Content-Type-Options "nosniff";
  add_header Referrer-Policy "no-referrer";
  add_header Content-Security-Policy
    "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'";
}
