server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;

  # Ojo con `add_header`: nginx NO acumula las cabeceras heredadas, las
  # sustituye. Cualquier location que declare una propia pierde las del
  # bloque server, así que todas incluyen seguridad.conf explícitamente.
  include /etc/nginx/snippets/seguridad.conf;

  # Es una SPA: cualquier ruta que no sea un fichero la resuelve el router del
  # cliente. Sin esto, recargar en /esquema/:id daría 404.
  location / {
    try_files $uri $uri/ /index.html;
    include /etc/nginx/snippets/seguridad.conf;
  }

  # Los assets llevan hash en el nombre, así que pueden cachearse para siempre.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable" always;
    include /etc/nginx/snippets/seguridad.conf;
  }

  # El service worker y el index NO se cachean: si se quedaran pegados, la app
  # nunca se actualizaría aunque se redesplegara la imagen.
  location = /sw.js {
    add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    include /etc/nginx/snippets/seguridad.conf;
  }

  location = /index.html {
    add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    include /etc/nginx/snippets/seguridad.conf;
  }

  location = /manifest.webmanifest {
    add_header Cache-Control "no-cache" always;
    include /etc/nginx/snippets/seguridad.conf;
    default_type application/manifest+json;
  }
}
